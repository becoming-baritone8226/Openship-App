name: Release

# Push a tag to build, test, and publish a GitHub Release with per-ABI APKs.
#
# Optional repo secrets for signed releases:
#   ANDROID_KEYSTORE_BASE64  — base64 of your .jks/.keystore
#   OPENSHIP_STORE_PASSWORD  — keystore password
#   OPENSHIP_KEY_ALIAS       — key alias
#   OPENSHIP_KEY_PASSWORD    — key password
# Without them the workflow still publishes UNSIGNED APKs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' androidApp/build.gradle.kts)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName $VERSION in androidApp/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENSHIP_STORE_PASSWORD: ${{ secrets.OPENSHIP_STORE_PASSWORD }}
          OPENSHIP_KEY_ALIAS: ${{ secrets.OPENSHIP_KEY_ALIAS }}
          OPENSHIP_KEY_PASSWORD: ${{ secrets.OPENSHIP_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — publishing UNSIGNED APKs"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openship-release.jks"
          {
            echo "OPENSHIP_STORE_FILE=$RUNNER_TEMP/openship-release.jks"
            echo "OPENSHIP_STORE_PASSWORD=$OPENSHIP_STORE_PASSWORD"
            echo "OPENSHIP_KEY_ALIAS=$OPENSHIP_KEY_ALIAS"
            echo "OPENSHIP_KEY_PASSWORD=$OPENSHIP_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build release APKs
        run: ./gradlew :shared:allTests :androidApp:assembleRelease

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd androidApp/build/outputs/apk/release
          for apk in androidApp-*-release*.apk; do
            abi=${apk#androidApp-}; abi=${abi%%-release*}
            mv "$apk" "openship-$VERSION-$abi.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/mapping/release/mapping.txt
